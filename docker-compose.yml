services:
  postgres:
    image: postgres:18-alpine
    container_name: carproject-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carproject
      POSTGRES_PASSWORD: carproject
      POSTGRES_DB: carproject
      # Explicit PGDATA keeps the volume path stable across major versions.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carproject -d carproject']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./BE
    container_name: carproject-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://carproject:carproject@postgres:5432/carproject?schema=public
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Node 24 has global fetch; no curl needed in the image.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
